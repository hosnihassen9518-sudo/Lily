name: lily

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "lily/healthcheck", "-m", "ok", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in the root .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the root .env}"
      DATABASE_URL: sqlite:////data/lily.db
      MUSIC_DIR: /data/music
      DEVICE_SIGNING_KEY_FILE: /data/device-signing.pem
      FACTORY_BACKEND_HOST: "${FACTORY_BACKEND_HOST:-192.168.1.100}"
      FACTORY_BACKEND_PORT: "${BACKEND_PORT:-6100}"
      FACTORY_MQTT_HOST: "${FACTORY_MQTT_HOST:-192.168.1.100}"
      FACTORY_MQTT_PORT: "${MQTT_PORT:-1883}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-6100}:6100"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  admin:
    build:
      context: ./admin_portal
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-6080}:6080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

volumes:
  backend_data:
  mqtt_data:
